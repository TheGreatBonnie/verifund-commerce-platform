[project]
name = "marketmesh"
version = "0.1.0"
description = "MarketMesh A2A commerce exchange"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "a2a-sdk[http-server,sqlite,fastapi]==1.2.3",
  "ag-ui-langgraph==0.0.47",
  "ag-ui-protocol>=0.1.22,<0.2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langchain-openai>=0.3,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "tenacity>=9,<10",
  "prometheus-client>=0.21,<1",
  "google-adk>=1.0,<2",
  "ag-ui-adk>=0.1,<1",
  "litellm>=1.84,<2",
  "svix>=1.40,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "respx>=0.22,<1",
  "ruff>=0.14,<1",
  "mypy>=1.19,<2",
]

[tool.uv.workspace]
members = [
  "packages/commerce_core",
  "packages/verifund_contracts",
  "apps/registry",
  "apps/seller_agent",
  "apps/buyer_agent",
  "apps/orchestrator_agent",
  "apps/verifund_control_plane",
  "apps/verifund_agent",
]

[tool.uv]
package = false

[tool.uv.sources]
marketmesh-commerce-core = { workspace = true }
verifund-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py312"
