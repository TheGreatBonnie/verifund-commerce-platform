# Render blueprint for the merged MarketMesh gateway.
#
# The running service is `gateway`, built from the `deploy/render` branch.
# Render assigned it the slug `gateway-795m`, so its hostname is
# `gateway-795m.onrender.com`; `gateway.onrender.com` is a different host
# and answers 404. Every URL below points at the real host.
#
# The live service is not blueprint-managed, so this file describes what the
# running gateway needs rather than driving it. Creating a service from it
# reproduces the running configuration.
#
# The six sub-apps share one Postgres instance and each uses its own logical
# database on it (buyer, sellers, registry, orchestrator, verifund,
# verifund_agent). A blueprint cannot express that split, so those URLs stay
# `sync: false` and are set in the dashboard.

services:
  - type: web
    runtime: docker
    name: gateway
    plan: free
    region: oregon
    branch: deploy/render
    dockerfilePath: ./Dockerfile.python
    dockerCommand: python -m gateway
    # No HTTP health check: a busy agent run can stall the single-worker event
    # loop and fail Render's 5s probe, causing 60s-timeout restarts. Render's
    # default TCP probe still monitors the port without depending on the loop.
    envVars:
      - fromGroup: gateway-shared
      - key: PORT
        value: "10000"
      - key: ALLOWED_CARD_HOSTS
        value: '["gateway-795m.onrender.com", "127.0.0.1", "localhost"]'
      - key: REGISTRY_URL
        value: https://gateway-795m.onrender.com/registry
      - key: BUYER_A2A_URL
        value: https://gateway-795m.onrender.com/buyer
      - key: BUYER_PUBLIC_BASE_URL
        value: https://gateway-795m.onrender.com/buyer
      - key: BUYER_INTERNAL_URL
        value: https://gateway-795m.onrender.com/buyer
      - key: PUBLIC_BASE_URL
        value: https://gateway-795m.onrender.com/sellers
      - key: SELLER_SHARED_URL
        value: https://gateway-795m.onrender.com/sellers
      - key: VERIFUND_URL
        value: https://gateway-795m.onrender.com/control-plane
      - key: VERIFUND_CONTROL_PLANE_URL
        value: https://gateway-795m.onrender.com/control-plane
      - key: VERIFUND_PUBLIC_BASE_URL
        value: https://gateway-795m.onrender.com/control-plane
      - key: VERIFUND_AGENT_URL
        value: https://gateway-795m.onrender.com/verifund-agent
      - key: VERIFUND_AGENT_CARD_URL
        value: https://gateway-795m.onrender.com/verifund-agent/.well-known/agent-card.json
      - key: VERIFUND_CONSOLE_BASE_URL
        value: https://verifund-console.vercel.app
      - key: VERIFUND_ALLOW_PUBLIC_BIND
        value: "1"
      - key: VERIFUND_EVIDENCE_DIR
        value: /app/data/evidence
      - key: BUYER_CHECKPOINT_PATH
        value: /app/data/buyer-checkpoints.db
      - key: SELLER_CHECKPOINT_PATH
        value: /app/data/seller-checkpoints.db
      - key: VERIFUND_AGENT_CHECKPOINT_PATH
        value: /app/data/agent-checkpoints.db
      - key: SELLER_CONFIG_SOURCE
        value: shared
      - key: BUYER_DATABASE_URL
        sync: false
      - key: BUYER_CHECKPOINT_URL
        sync: false
      - key: REGISTRY_DATABASE_URL
        sync: false
      - key: SELLER_SHARED_DB_URL
        sync: false
      - key: SELLER_CHECKPOINT_URL
        sync: false
      - key: ORCHESTRATOR_SESSION_DB_URL
        sync: false
      - key: VERIFUND_DATABASE_URL
        sync: false
      - key: VERIFUND_AGENT_DATABASE_URL
        sync: false
      - key: VERIFUND_AGENT_CHECKPOINT_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false

databases:
  - name: marketmesh
    plan: free
    region: oregon
    databaseName: marketmesh
    user: marketmesh

