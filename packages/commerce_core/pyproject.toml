[project]
name = "marketmesh-commerce-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "a2a-sdk==1.2.3",
  "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "langchain-core>=1.0,<2",
  "openai>=1.100,<3",
  "numpy>=1.26,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commerce_core"]
